# Configuration for Qwen2.5-Math-7B-Instruct — majority voting / RM selection
# Use temperature=0.7, top_p=0.8 for diversity (Maj@8, RM@8)
model:
  name: "Qwen/Qwen2.5-Math-7B-Instruct"
  api_base: "http://localhost:8000/v1"
  api_key: "EMPTY"

generation:
  temperature: 0.7
  top_p: 0.8
  max_tokens: 2048
  stop_sequences:
    - "```output"

critique:
  enabled: false          # disable critique for faster sampling

python_tool:
  enabled: true
  timeout_seconds: 30

max_turns: 15
max_context_tokens: 3800
output_dir: "results/qwen_7b_majority"
