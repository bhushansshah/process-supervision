# Configuration for DeepSeek-Math-7B-Instruct
model:
  name: "deepseek-ai/deepseek-math-7b-instruct"
  api_base: "http://localhost:8000/v1"
  api_key: "EMPTY"

generation:
  temperature: 0.0
  top_p: 1.0
  max_tokens: 2048
  stop_sequences:
    - "```output"

critique:
  enabled: true
  frequency: 1
  after_code_only: false

python_tool:
  enabled: true
  timeout_seconds: 30
  allowed_modules:
    - sympy
    - math
    - numpy
    - fractions
    - itertools
    - functools
    - collections

max_turns: 15
max_context_tokens: 3800
output_dir: "results/deepseek_7b"
